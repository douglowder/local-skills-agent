[project]
name = "skills"
version = "0.1.0"
description = "Local Ollama-based reimplementation of Claude Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[project.scripts]
skills = "skills.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=skills --cov-report=term-missing"
